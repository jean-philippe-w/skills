<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>architect</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --panel: #f5f5f4; --line: #e2e1de; --text: #1f1f1e;
    --muted: #6b6a66; --accent: #2f6fdb; --accent-bg: #e6eefc; --ok: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1b1b1a; --panel: #242423; --line: #3a3a38; --text: #ecebe8;
      --muted: #a09f9a; --accent: #7aa7f5; --accent-bg: #2a3448; --ok: #5fbf68;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1b1b1a; --panel: #242423; --line: #3a3a38; --text: #ecebe8;
    --muted: #a09f9a; --accent: #7aa7f5; --accent-bg: #2a3448; --ok: #5fbf68;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; flex-wrap: wrap;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header strong { font-size: 14px; }
  #status { margin-left: auto; color: var(--muted); padding: 2px 10px; border-radius: 10px;
            transition: background .3s, color .3s; }
  #status.flash { background: var(--ok); color: #fff; }
  .layout { flex: 1; display: flex; min-height: 0; }
  aside { width: 240px; flex: none; overflow: auto; border-right: 1px solid var(--line);
          background: var(--panel); padding: 6px; box-sizing: border-box; }
  aside button { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px;
                 background: none; color: inherit; font: inherit; padding: 5px 8px;
                 cursor: pointer; overflow-wrap: anywhere; }
  aside button:hover { background: var(--line); }
  aside button[aria-current="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  aside button small { display: block; color: var(--muted); font-weight: 400; }
  aside button.folder { display: flex; gap: 4px; font-weight: 500; }
  aside button.folder .chevron { width: 10px; flex: none; color: var(--muted); }
  main { flex: 1; position: relative; min-width: 0; }
  #viewer { position: absolute; inset: 0; }
  #message { position: absolute; inset: 0; display: none; align-items: center;
             justify-content: center; color: var(--muted); text-align: center; padding: 16px; }
  code { overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    aside { width: auto; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <strong>architect</strong>
  <label><input type="checkbox" id="follow" checked> follow the last modified</label>
  <span id="status">connecting…</span>
</header>
<div class="layout">
  <aside id="files" aria-label="Explorer"></aside>
  <main>
    <div id="viewer"></div>
    <div id="message"></div>
  </main>
</div>
<script src="/viewer-static.min.js"></script>
<script>
  const list = document.getElementById('files');
  const follow = document.getElementById('follow');
  const status = document.getElementById('status');
  const holder = document.getElementById('viewer');
  const message = document.getElementById('message');

  let current = new URLSearchParams(location.search).get('file');
  if (current) follow.checked = false;   // ?file=... pins one diagram
  let version = null;    // version of the shown file
  let viewer = null;     // current GraphViewer
  let fitScale = null;   // scale right after the first render
  let shownTree = '';
  let lastFiles = [];

  // Collapsed explorer folders, kept per browser (storage may be unavailable).
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* per-session only */ } },
  };
  const collapsed = new Set(JSON.parse(storage.get('architect:collapsed') || '[]'));
  const saveCollapsed = () => storage.set('architect:collapsed', JSON.stringify([...collapsed]));

  function setStatus(text, flash) {
    status.textContent = text;
    if (flash) {
      status.classList.add('flash');
      setTimeout(() => status.classList.remove('flash'), 800);
    }
  }

  function showMessage(html) {
    message.innerHTML = html;
    message.style.display = html ? 'flex' : 'none';
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function ago(mtime) {
    const s = Math.max(0, Math.round(Date.now() / 1000 - mtime));
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(mtime * 1000).toLocaleDateString();
  }

  // The explorer: the folders that hold diagrams, as a tree. Folders with no
  // .drawio anywhere below never appear, since the server lists only diagrams.
  function buildTree(files) {
    const root = { name: '', path: '', folders: new Map(), files: [] };
    for (const f of files) {
      const parts = f.path.split('/');
      let node = root;
      for (const part of parts.slice(0, -1)) {
        if (!node.folders.has(part)) {
          const path = node.path ? node.path + '/' + part : part;
          node.folders.set(part, { name: part, path, folders: new Map(), files: [] });
        }
        node = node.folders.get(part);
      }
      node.files.push({ ...f, name: parts[parts.length - 1] });
    }
    return compact(root);
  }

  // VS Code's compact folders: a folder whose only child is a folder shows as "a/b".
  function compact(node) {
    for (const [key, child] of node.folders) {
      let merged = child;
      while (merged.files.length === 0 && merged.folders.size === 1) {
        const only = merged.folders.values().next().value;
        merged = { ...only, name: merged.name + '/' + only.name };
      }
      node.folders.set(key, compact(merged));
    }
    return node;
  }

  function renderNode(node, depth) {
    const rows = [];
    const indent = px => (8 + depth * 14 + px) + 'px';
    for (const folder of [...node.folders.values()].sort((a, b) => a.name.localeCompare(b.name))) {
      const isOpen = !collapsed.has(folder.path);
      const b = document.createElement('button');
      b.className = 'folder';
      b.style.paddingLeft = indent(0);
      b.setAttribute('aria-expanded', isOpen);
      const chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.textContent = isOpen ? '▾' : '▸';
      b.append(chevron, folder.name);
      b.onclick = () => {
        if (isOpen) collapsed.add(folder.path); else collapsed.delete(folder.path);
        saveCollapsed();
        renderTree(lastFiles);
      };
      rows.push(b);
      if (isOpen) rows.push(...renderNode(folder, depth + 1));
    }
    for (const f of [...node.files].sort((a, b) => a.name.localeCompare(b.name))) {
      const b = document.createElement('button');
      b.style.paddingLeft = indent(14);
      b.title = f.path;
      b.setAttribute('aria-current', f.path === current);
      b.textContent = f.name;
      const when = document.createElement('small');
      when.textContent = ago(f.mtime);
      b.appendChild(when);
      b.onclick = () => { follow.checked = false; select(f.path); poll(); };
      rows.push(b);
    }
    return rows;
  }

  function renderTree(files) {
    lastFiles = files;
    // the current minute also refreshes the "… ago" labels
    const key = files.map(f => f.path + f.version).join('|') + current
              + [...collapsed].join('|') + Math.floor(Date.now() / 60000);
    if (key === shownTree) return;
    shownTree = key;
    list.replaceChildren(...renderNode(buildTree(files), 0));
  }

  function select(path) {
    if (path === current) return;
    // open the folders down to the shown diagram
    for (let i = path.indexOf('/'); i !== -1; i = path.indexOf('/', i + 1)) collapsed.delete(path.slice(0, i));
    saveCollapsed();
    current = path;
    version = null;
    fitScale = null;
    history.replaceState(null, '', follow.checked ? location.pathname
                                                  : '?file=' + encodeURIComponent(path));
  }

  // What carries over from one render to the next: the page, and the zoom if it was changed.
  function snapshot() {
    if (!viewer || !viewer.graph) return null;
    const view = viewer.graph.view;
    const isZoomed = fitScale != null && Math.abs(view.scale - fitScale) > 1e-3;
    return { page: viewer.currentPage || 0,
             view: isZoomed ? [view.scale, view.translate.x, view.translate.y] : null };
  }

  function render(xml, keep) {
    const el = document.createElement('div');
    el.className = 'mxgraph';
    // inline size: without it the viewer takes the size of the drawing
    el.style.width = '100%';
    el.style.height = `calc(100% - ${GraphViewer.prototype.toolbarHeight || 26}px)`;
    el.setAttribute('data-mxgraph', JSON.stringify({
      xml,
      page: keep ? keep.page : 0,
      nav: true,
      resize: false,
      'auto-fit': true,
      center: true,
      'dark-mode': 'auto',
      editable: false,
      'toolbar-nohide': true,
      toolbar: 'pages zoom layers tags' + (window.self === window.top ? ' lightbox' : ''),
    }));
    holder.replaceChildren(el);
    GraphViewer.createViewerForElement(el, v => {
      viewer = v;
      if (!v.graph) return;   // setup deferred: the page lost its size meanwhile
      if (keep && keep.view) v.graph.view.scaleAndTranslate(...keep.view);
      else fitScale = v.graph.view.scale;
    });
  }

  async function loadDiagram(file, newVersion) {
    const res = await fetch('/diagram?file=' + encodeURIComponent(file) + '&ts=' + Date.now());
    if (file !== current) return;   // another file was picked during the request
    if (!res.ok) { showMessage('Cannot read <code>' + escapeHtml(file) + '</code>'); return; }
    const xml = await res.text();
    if (file !== current) return;
    const keep = version === null ? null : snapshot();
    version = newVersion;
    showMessage('');
    try {
      render(xml, keep);
      setStatus(file + (keep ? ' updated ' : ' shown ') + new Date().toLocaleTimeString(), !!keep);
    } catch (e) {
      showMessage('Unreadable diagram: ' + escapeHtml(e.message));
    }
  }

  async function poll() {
    try {
      const data = await (await fetch('/api/files?ts=' + Date.now())).json();
      const files = data.files;
      if (!files.length) {
        list.innerHTML = '';
        holder.replaceChildren();
        viewer = null;
        showMessage('No <code>.drawio</code> file in<br><code>' + escapeHtml(data.root) + '</code>');
        return;
      }
      if (follow.checked && files[0].path !== current) select(files[0].path);   // newest first
      else if (!files.some(f => f.path === current)) select(files[0].path);
      renderTree(files);
      const entry = files.find(f => f.path === current);
      // draw.io's viewer defers its setup while its container has no width
      // (a hidden pane) and only resumes on a DOM attribute change, which
      // showing the pane never makes: draw once the page has a size.
      const hasSize = holder.offsetWidth > 0;
      if (entry && entry.version !== version && hasSize) await loadDiagram(current, entry.version);
    } catch (e) {
      setStatus('server unreachable');
    }
  }

  follow.addEventListener('change', () => {
    if (follow.checked) history.replaceState(null, '', location.pathname);
    poll();
  });

  if (typeof GraphViewer === 'undefined') {
    showMessage('viewer-static.min.js could not be loaded.');
  } else {
    poll();
    setInterval(poll, 1000);
  }
</script>
</body>
</html>
